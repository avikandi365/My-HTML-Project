<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */
    .flag{
      width:900px;
      height:600px;
      background-color: red;
      position: absolute;
    }

    p{
      font-size: 5rem;
      color:white;
      text-align:center ;
      padding: 0;
      margin: 0;
    }
    .flag > div{
      width: 100%;
      height: 300px;
      position: absolute;
      top: 150px;
      background-color: #002868;
    }
   

    .flag > div p{
      
      color: black;
  
    }
    div div div {
      border: 1 px solid white;
      background-color: white;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      text-align: center;
      font-size: 25px;
      position: relative;
      top: 50px;
      left: 350px;
    }
    
  </style>
</head>
